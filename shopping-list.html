<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>우리 집 장보기</title>
<style>
  :root {
    --bg: #fff8ef;
    --card: #ffffff;
    --ink: #5a4a4f;
    --ink-soft: #a08f94;
    --line: #f1e3dc;
    --pink: #ff9eb5;
    --pink-deep: #f27a98;
    --mint: #bfeedd;
    --sky: #c9e6ff;
    --lemon: #fff0a8;
    --peach: #ffd8c2;
    --lilac: #e4d8ff;
    --shadow: 0 6px 0 rgba(242, 122, 152, .12), 0 10px 24px rgba(160, 120, 130, .10);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background:
      radial-gradient(circle at 12% 8%, #ffe3ec 0 60px, transparent 61px),
      radial-gradient(circle at 92% 18%, #e2f6ee 0 46px, transparent 47px),
      radial-gradient(#f6e6dd 1.2px, transparent 1.3px) 0 0 / 22px 22px,
      var(--bg);
    color: var(--ink);
    font-family: "Apple SD Gothic Neo", "Hiragino Maru Gothic ProN", "Nanum Gothic", "Malgun Gothic", system-ui, sans-serif;
    min-height: 100vh;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 24px 16px 48px; }

  /* 머리 */
  header { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; }
  .mascot { width: 96px; height: 96px; flex: none; animation: bob 2.6s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(-5px) rotate(-2deg); } }
  h1 { margin: 0; font-size: 28px; letter-spacing: -0.5px; color: var(--pink-deep); }
  .bubble {
    position: relative; display: inline-block; margin-top: 6px;
    background: var(--card); border: 2px solid var(--line); border-radius: 16px;
    padding: 6px 12px; font-size: 14px;
  }
  .bubble::before {
    content: ""; position: absolute; left: -9px; top: 12px;
    border: 8px solid transparent; border-right-color: var(--line); border-left: 0;
  }

  /* 진행률 */
  .progress { background: var(--card); border-radius: 22px; padding: 14px 16px; box-shadow: var(--shadow); margin-bottom: 16px; }
  .progress-top { display: flex; justify-content: space-between; font-size: 15px; margin-bottom: 8px; }
  .progress-top b { color: var(--pink-deep); }
  .bar { height: 16px; border-radius: 99px; background: #fbeff2; overflow: hidden; }
  .bar span {
    display: block; height: 100%; width: 0; border-radius: 99px;
    background: repeating-linear-gradient(45deg, var(--pink) 0 10px, #ffb3c6 10px 20px);
    transition: width .4s cubic-bezier(.3, 1.4, .5, 1);
  }

  /* 추가 칸 */
  form.add {
    background: var(--card); border-radius: 22px; padding: 14px; box-shadow: var(--shadow);
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 20px;
  }
  form.add input, form.add select {
    font: inherit; color: var(--ink); width: 100%;
    border: 2px solid var(--line); border-radius: 14px; padding: 10px 12px; background: #fffdfb;
    outline: none;
  }
  form.add input:focus, form.add select:focus { border-color: var(--pink); }
  form.add .name { grid-column: 1 / -1; }
  form.add button { grid-column: 1 / -1; }
  .btn {
    font: inherit; font-weight: 700; cursor: pointer; border: 0; border-radius: 16px; padding: 11px 16px;
    background: var(--pink); color: #fff; box-shadow: 0 4px 0 var(--pink-deep);
    transition: transform .08s, box-shadow .08s;
  }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--pink-deep); }
  .btn.ghost { background: var(--card); color: var(--pink-deep); border: 2px solid var(--pink); box-shadow: 0 4px 0 #f6c9d5; }

  /* 종류별 카드 */
  .cat { border-radius: 24px; padding: 14px 14px 10px; margin-bottom: 14px; box-shadow: var(--shadow); }
  .cat h2 { margin: 0 0 8px; font-size: 17px; display: flex; align-items: center; gap: 6px; }
  .cat h2 small { margin-left: auto; font-size: 13px; font-weight: 400; color: var(--ink-soft); }
  .cat ul { list-style: none; margin: 0; padding: 0; }
  .cat .empty { font-size: 13px; color: var(--ink-soft); padding: 6px 4px 8px; }
  li.item {
    display: flex; align-items: center; gap: 10px;
    background: rgba(255, 255, 255, .85); border-radius: 16px; padding: 9px 10px; margin-bottom: 6px;
    transition: opacity .2s;
  }
  li.item label { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; cursor: pointer; }
  li.item input { position: absolute; opacity: 0; pointer-events: none; }
  .check {
    flex: none; width: 26px; height: 26px; border-radius: 50%;
    border: 2.5px solid var(--pink); background: #fff;
    display: grid; place-items: center; transition: background .15s, transform .15s;
  }
  .check svg { width: 14px; height: 14px; opacity: 0; transform: scale(.4); transition: .2s cubic-bezier(.3, 1.6, .5, 1); }
  li.item input:checked + .check { background: var(--pink); transform: scale(1.05); }
  li.item input:checked + .check svg { opacity: 1; transform: scale(1); }
  li.item input:focus-visible + .check { outline: 3px solid var(--sky); outline-offset: 2px; }
  .text { min-width: 0; overflow-wrap: anywhere; }
  .text .note { font-size: 13px; color: var(--ink-soft); margin-left: 6px; }
  li.item.done { opacity: .5; }
  li.item.done .text { text-decoration: line-through; text-decoration-color: var(--pink-deep); text-decoration-thickness: 2px; }
  .del {
    flex: none; width: 28px; height: 28px; border-radius: 50%; border: 0; cursor: pointer;
    background: transparent; color: var(--ink-soft); font-size: 18px; line-height: 1;
  }
  .del:hover { background: #fde8ee; color: var(--pink-deep); }

  .c-veg { background: var(--mint); }
  .c-meat { background: var(--peach); }
  .c-dairy { background: var(--sky); }
  .c-grain { background: var(--lemon); }
  .c-life { background: var(--lilac); }

  .footer { text-align: center; margin-top: 22px; }
  .hint { font-size: 12px; color: var(--ink-soft); margin-top: 10px; }

  /* 다 샀을 때 반짝이 */
  .sparkle { position: fixed; pointer-events: none; font-size: 22px; animation: pop 1.2s ease-out forwards; }
  @keyframes pop { from { transform: translateY(0) scale(.4); opacity: 1; } to { transform: translateY(-120px) scale(1.2); opacity: 0; } }

  @media (max-width: 420px) {
    form.add { grid-template-columns: 1fr; }
    .mascot { width: 78px; height: 78px; }
    h1 { font-size: 24px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <svg class="mascot" viewBox="0 0 120 120" aria-hidden="true">
      <!-- 주먹밥 친구 -->
      <ellipse cx="60" cy="112" rx="34" ry="5" fill="#f3dfd6"/>
      <path d="M60 14 C78 14 106 62 106 82 C106 100 90 108 60 108 C30 108 14 100 14 82 C14 62 42 14 60 14Z" fill="#fff" stroke="#5a4a4f" stroke-width="3"/>
      <rect x="40" y="80" width="40" height="26" rx="4" fill="#3d4a45"/>
      <g id="eyes">
        <circle cx="45" cy="62" r="4.5" fill="#5a4a4f"/>
        <circle cx="75" cy="62" r="4.5" fill="#5a4a4f"/>
      </g>
      <g id="eyesHappy" style="display:none" fill="none" stroke="#5a4a4f" stroke-width="3.5" stroke-linecap="round">
        <path d="M39 64 Q45 56 51 64"/>
        <path d="M69 64 Q75 56 81 64"/>
      </g>
      <ellipse cx="36" cy="72" rx="7" ry="4.5" fill="#ffb3c6"/>
      <ellipse cx="84" cy="72" rx="7" ry="4.5" fill="#ffb3c6"/>
      <path id="mouth" d="M54 70 Q60 76 66 70" fill="none" stroke="#5a4a4f" stroke-width="3" stroke-linecap="round"/>
      <!-- 장바구니 -->
      <g transform="translate(86 84) rotate(8)">
        <path d="M2 4 Q12 -12 22 4" fill="none" stroke="#f27a98" stroke-width="3"/>
        <rect x="-2" y="4" width="28" height="18" rx="5" fill="#ff9eb5" stroke="#5a4a4f" stroke-width="2.5"/>
        <circle cx="6" cy="2" r="4" fill="#9be0c4"/>
        <circle cx="16" cy="1" r="4" fill="#ffe070"/>
      </g>
    </svg>
    <div>
      <h1>우리 집 장보기</h1>
      <div class="bubble" id="say">오늘도 같이 장 보러 가요!</div>
    </div>
  </header>

  <section class="progress" aria-live="polite">
    <div class="progress-top"><span id="progressText"></span><b id="progressPct"></b></div>
    <div class="bar"><span id="bar"></span></div>
  </section>

  <form class="add" id="addForm" autocomplete="off">
    <input class="name" id="newName" placeholder="살 물건 (예: 계란)" aria-label="살 물건" required maxlength="40">
    <input id="newNote" placeholder="수량·메모 (예: 2판)" aria-label="수량이나 메모" maxlength="40">
    <select id="newCat" aria-label="종류"></select>
    <button class="btn" type="submit">＋ 추가하기</button>
  </form>

  <main id="list"></main>

  <div class="footer">
    <button class="btn ghost" id="resetBtn" type="button">🔄 체크 모두 풀기</button>
    <div class="hint">목록은 이 브라우저 안에만 저장돼요.</div>
  </div>
</div>

<script>
  const STORAGE_KEY = "jangbogi-v1";

  const CATS = [
    { id: "veg",   icon: "🥬", name: "채소·과일" },
    { id: "meat",  icon: "🥩", name: "고기·생선" },
    { id: "dairy", icon: "🥛", name: "유제품·달걀" },
    { id: "grain", icon: "🍚", name: "곡물·가공식품" },
    { id: "life",  icon: "🧻", name: "생활용품" },
  ];

  const DEFAULT_ITEMS = [
    ["veg", "대파"], ["veg", "양파"], ["veg", "사과"],
    ["meat", "돼지고기"], ["meat", "고등어"],
    ["dairy", "우유"], ["dairy", "계란"], ["dairy", "두부"],
    ["grain", "쌀"], ["grain", "라면"],
    ["life", "휴지"], ["life", "주방세제"],
  ];

  let nextId = 1;
  const newItem = (cat, name, note = "") => ({ id: nextId++, cat, name, note, done: false, doneAt: 0 });

  function load() {
    try {
      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
      if (saved && Array.isArray(saved.items)) {
        nextId = saved.items.reduce((m, it) => Math.max(m, it.id), 0) + 1;
        return saved.items;
      }
    } catch (e) { /* 저장된 게 없거나 읽을 수 없으면 기본 목록으로 */ }
    return DEFAULT_ITEMS.map(([cat, name]) => newItem(cat, name));
  }

  function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify({ items })); } catch (e) { /* 저장 불가한 환경 */ }
  }

  let items = load();
  let wasAllDone = items.length > 0 && items.every(it => it.done);

  const $ = id => document.getElementById(id);
  const catSelect = $("newCat");
  CATS.forEach(c => catSelect.add(new Option(`${c.icon} ${c.name}`, c.id)));

  const CHECK_SVG = '<svg viewBox="0 0 16 16"><path d="M3 8.5l3.2 3L13 4.5" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  function render() {
    const list = $("list");
    list.innerHTML = "";
    CATS.forEach(cat => {
      const mine = items.filter(it => it.cat === cat.id);
      const todo = mine.filter(it => !it.done);
      const done = mine.filter(it => it.done).sort((a, b) => a.doneAt - b.doneAt);

      const sec = document.createElement("section");
      sec.className = `cat c-${cat.id}`;
      sec.innerHTML = `<h2>${cat.icon} ${cat.name}<small>${done.length}/${mine.length}</small></h2>`;
      const ul = document.createElement("ul");
      [...todo, ...done].forEach(it => ul.appendChild(renderItem(it)));
      if (!mine.length) {
        const p = document.createElement("div");
        p.className = "empty";
        p.textContent = "아직 비어 있어요";
        sec.appendChild(p);
      }
      sec.appendChild(ul);
      list.appendChild(sec);
    });
    renderProgress();
  }

  function renderItem(it) {
    const li = document.createElement("li");
    li.className = "item" + (it.done ? " done" : "");

    const label = document.createElement("label");
    const box = document.createElement("input");
    box.type = "checkbox";
    box.checked = it.done;
    box.addEventListener("change", () => {
      it.done = box.checked;
      it.doneAt = box.checked ? Date.now() : 0;
      save();
      render();
    });
    const check = document.createElement("span");
    check.className = "check";
    check.innerHTML = CHECK_SVG;
    const text = document.createElement("span");
    text.className = "text";
    text.textContent = it.name;
    if (it.note) {
      const note = document.createElement("span");
      note.className = "note";
      note.textContent = "— " + it.note;
      text.appendChild(note);
    }
    label.append(box, check, text);

    const del = document.createElement("button");
    del.className = "del";
    del.type = "button";
    del.textContent = "×";
    del.title = `${it.name} 지우기`;
    del.setAttribute("aria-label", `${it.name} 지우기`);
    del.addEventListener("click", () => {
      items = items.filter(x => x.id !== it.id);
      save();
      render();
    });

    li.append(label, del);
    return li;
  }

  function renderProgress() {
    const total = items.length;
    const done = items.filter(it => it.done).length;
    const pct = total ? Math.round(done / total * 100) : 0;
    $("progressText").textContent = total ? `${total}개 중 ${done}개 샀어요` : "목록이 비어 있어요";
    $("progressPct").textContent = pct + "%";
    $("bar").style.width = pct + "%";

    const allDone = total > 0 && done === total;
    let line;
    if (!total) line = "살 물건을 추가해 주세요~";
    else if (allDone) line = "다 샀다! 수고했어요 ✨";
    else if (done === 0) line = "오늘도 같이 장 보러 가요!";
    else if (pct >= 50) line = "거의 다 왔어요! 힘내요!";
    else line = "좋아요, 하나씩 담아 봐요!";
    $("say").textContent = line;

    const happy = pct >= 50;
    $("eyes").style.display = happy ? "none" : "";
    $("eyesHappy").style.display = happy ? "" : "none";
    $("mouth").setAttribute("d", allDone ? "M52 69 Q60 82 68 69 Z" : happy ? "M53 69 Q60 79 67 69" : "M54 70 Q60 76 66 70");
    $("mouth").setAttribute("fill", allDone ? "#f27a98" : "none");

    if (allDone && !wasAllDone) celebrate();
    wasAllDone = allDone;
  }

  function celebrate() {
    const marks = ["✨", "🌸", "⭐", "💖", "🎉"];
    const rect = document.querySelector(".mascot").getBoundingClientRect();
    for (let i = 0; i < 14; i++) {
      const s = document.createElement("span");
      s.className = "sparkle";
      s.textContent = marks[i % marks.length];
      s.style.left = rect.left + rect.width / 2 + (Math.random() - .5) * 160 + "px";
      s.style.top = rect.top + rect.height / 2 + (Math.random() - .5) * 60 + "px";
      s.style.animationDelay = Math.random() * .3 + "s";
      document.body.appendChild(s);
      setTimeout(() => s.remove(), 1600);
    }
  }

  $("addForm").addEventListener("submit", e => {
    e.preventDefault();
    const name = $("newName").value.trim();
    if (!name) return;
    items.push(newItem(catSelect.value, name, $("newNote").value.trim()));
    save();
    render();
    $("newName").value = "";
    $("newNote").value = "";
    $("newName").focus();
  });

  $("resetBtn").addEventListener("click", () => {
    if (!items.some(it => it.done)) return;
    if (!confirm("체크를 모두 풀까요? 항목은 그대로 남아요.")) return;
    items.forEach(it => { it.done = false; it.doneAt = 0; });
    save();
    render();
  });

  render();
</script>
</body>
</html>
